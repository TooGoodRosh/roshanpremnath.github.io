<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apotheosis — Roshan Premnath</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #0D0D0D; color: #F0F0F0; }

/* NAV */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(13,13,13,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0 64px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.nav-name { font-size: 16px; font-weight: 700; color: #F47A23; text-decoration: none; letter-spacing: -0.5px; }
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a { font-size: 13px; font-weight: 500; color: rgba(240,240,240,0.5); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover { color: #F0F0F0; }
.nav-links a.active { color: #DC143C; }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
.hamburger span { display: block; width: 22px; height: 2px; background: #F0F0F0; transition: all 0.2s; }
.mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; background: #0D0D0D; border-bottom: 1px solid rgba(255,255,255,0.06); padding: 24px; flex-direction: column; gap: 20px; z-index: 99; }
.mobile-menu a { font-size: 16px; font-weight: 500; color: rgba(240,240,240,0.7); text-decoration: none; }
.mobile-menu.open { display: flex; }

/* HERO */
.hero { position: relative; width: 100%; height: 100vh; overflow: hidden; margin-top: 60px; }
.hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; filter: brightness(0.45); }
.hero-placeholder { width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
.hero-placeholder-text { font-size: 13px; color: rgba(240,240,240,0.2); letter-spacing: 2px; text-transform: uppercase; }
.hero-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 64px; background: linear-gradient(to top, rgba(13,13,13,1) 0%, rgba(13,13,13,0.6) 50%, transparent 100%); }
.hero-tag { font-size: 11px; font-weight: 500; color: #DC143C; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.hero-title { font-size: 80px; font-weight: 700; color: #F0F0F0; line-height: 1; letter-spacing: -2px; margin-bottom: 20px; }
.hero-headline { font-size: 20px; font-weight: 400; color: rgba(240,240,240,0.7); max-width: 560px; line-height: 1.6; }
.hero-scroll { position: absolute; bottom: 32px; right: 64px; font-size: 11px; color: rgba(240,240,240,0.3); letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.hero-scroll::before { content: ''; display: block; width: 32px; height: 1px; background: rgba(240,240,240,0.3); }

/* RESPONSIVE */
@media (max-width: 768px) {
  nav { padding: 0 24px; }
  .nav-links { display: none; }
  .hamburger { display: flex; }
  .hero-overlay { padding: 32px 24px; }
  .hero-title { font-size: 48px; letter-spacing: -1px; }
  .hero-headline { font-size: 16px; }
  .hero-scroll { display: none; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-name" href="index.html">Roshan Premnath</a>
  <div class="nav-links">
    <a href="apotheosis.html" class="active">Apotheosis</a>
    <a href="survivethepale.html">Survive the Pale</a>
    <a href="zoneout.html">Zone-Out</a>
    <a href="celeste.html">Celeste</a>
  </div>
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="apotheosis.html">Apotheosis</a>
  <a href="survivethepale.html">Survive the Pale</a>
  <a href="zoneout.html">Zone-Out</a>
  <a href="celeste.html">Celeste</a>
</div>

<div class="hero">
  <div class="hero-placeholder">
    <span class="hero-placeholder-text">Replace with: images/apotheosis-hero.jpg</span>
  </div>
  <!-- When ready, replace the div above with: -->
  <!-- <img class="hero-image" src="images/apotheosis-hero.jpg" alt="Apotheosis concept art"> -->
  <div class="hero-overlay">
    <div class="hero-tag">Combat Design</div>
    <div class="hero-title">Apotheosis</div>
    <div class="hero-headline">Combat is designed on one principle. Bide your time until you earn a single decisive moment.</div>
  </div>
  <div class="hero-scroll">Scroll to explore</div>
</div>

<script>
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => mobileMenu.classList.toggle('open'));
</script>
</body>
</html>
